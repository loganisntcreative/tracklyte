{% if chart_data and chart_data != '{}' %}
<div class="bg-white border border-gray-200 rounded-2xl p-5 mb-4">
    <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-4">Progress over time</p>
    <div>
        <label class="block text-xs text-gray-500 mb-2">Event</label>
        <select id="chart-event-select"
            class="border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-400 mb-4">
        </select>
    </div>
    <canvas id="pr-chart" height="120"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
(function() {
    const raw = {{ chart_data | safe }};
    const events = Object.keys(raw);
    if (!events.length) return;

    const select = document.getElementById('chart-event-select');
    events.forEach(e => {
        const opt = document.createElement('option');
        opt.value = e;
        opt.textContent = e;
        select.appendChild(opt);
    });

    let chart;

    function renderChart(event) {
        const data = raw[event];
        if (chart) chart.destroy();
        chart = new Chart(document.getElementById('pr-chart'), {
            type: 'line',
            data: {
                labels: data.labels,
                datasets: [{
                    label: event,
                    data: data.values,
                    borderColor: '#1D9E75',
                    backgroundColor: 'rgba(29,158,117,0.08)',
                    tension: 0.3,
                    pointBackgroundColor: '#1D9E75',
                    pointRadius: 4,
                    fill: true,
                }]
            },
            options: {
                responsive: true,
                plugins: { legend: { display: false } },
                scales: {
                    y: {
                        reverse: true,
                        ticks: { font: { size: 11 } },
                        grid: { color: 'rgba(0,0,0,0.04)' }
                    },
                    x: {
                        ticks: { font: { size: 11 } },
                        grid: { display: false }
                    }
                }
            }
        });
    }

    renderChart(events[0]);
    select.addEventListener('change', () => renderChart(select.value));
})();
</script>
{% endif %}
